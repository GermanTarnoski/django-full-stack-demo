{% extends "main/base.html" %}
{% block content %}
<div class="container-lg mt-5">
    <div class="bg-light mx-auto p-5 rounded" style="max-width: 420px;">
        <h2 class="mb-4 text-center">Iniciar sesión</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Usuario</label>
                <input type="text" name="username" id="id_username" class="form-control" autofocus required>
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Contraseña</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            {% if form.errors %}
            <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
            {% endif %}
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
    </div>
</div>
{% endblock content %}
